# Keeps graphify-out/ (the code knowledge graph Claude reads first) in sync with main.
# graphify update rebuilds the code graph with tree-sitter only: no AI, no secrets, deterministic.
# A push made with GITHUB_TOKEN does not start other workflows, so this never triggers a deploy.
name: Update code graph

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: code-graph
  cancel-in-progress: true

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install "graphifyy[sql]==0.9.102"

      - run: graphify update .

      - name: Commit the graph if the code changed
        run: |
          set -euo pipefail
          if git diff --quiet -- graphify-out/graph.json; then
            echo "Graph is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphify-out/graph.json graphify-out/GRAPH_REPORT.md graphify-out/graph.html
          git commit -m "Update code graph [skip ci]"
          git push
