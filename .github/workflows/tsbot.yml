# Deploys TSbot (full-page Nara chat for embedding in IMTS via iframe) to Cloudflare Pages: https://tsbot-nara.pages.dev
# (tsbot.pages.dev never started serving: 522 / NXDOMAIN), and the IMTS page that shows it in an
# iframe to https://imtsbot.pages.dev.
#
# Secrets (already used by deploy.yml): CLOUDFLARE_API_TOKEN (also needs "Cloudflare Pages: Edit"), CLOUDFLARE_ACCOUNT_ID
# Repository variables or secrets (Settings > Secrets and variables > Actions; Variables tab preferred):
#   NARA_API_URL  origin of the Nara Worker, e.g. https://nara.<subdomain>.workers.dev   (required)
#   NARA_BOT_ID   bot id TSbot chats with (empty = the platform bot)
#   IMTS_ORIGIN   origin(s) of IMTS allowed to iframe TSbot, comma-separated, e.g. https://imts.example.com
# In the Nara dashboard, add the TSbot URL (see the run summary) to the bot's allowed origins if that list is not empty.
name: Deploy TSbot

on:
  push:
    branches: [tsbot]
    paths:
      - tsbot/**
      - public/widget.js
      - public/widget.css
      - scripts/build-tsbot.mjs
      - scripts/build-imts.mjs
      - scripts/origin.mjs
      - imts/**
      - .github/workflows/tsbot.yml
  workflow_dispatch:

concurrency:
  group: deploy-tsbot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qa:
    uses: ./.github/workflows/qa.yml

  deploy:
    needs: qa
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NARA_API_URL: ${{ vars.NARA_API_URL || secrets.NARA_API_URL }}
      NARA_BOT_ID: ${{ vars.NARA_BOT_ID || secrets.NARA_BOT_ID }}
      IMTS_ORIGIN: ${{ vars.IMTS_ORIGIN || secrets.IMTS_ORIGIN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      # The Cloudflare token is in this job's env: install without running dependency lifecycle scripts.
      - run: npm ci --ignore-scripts
      - name: Check settings
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first."; exit 1
          fi
          if [ -z "$NARA_API_URL" ]; then
            echo "::error::Set the NARA_API_URL repository variable (the Nara Worker origin)."; exit 1
          fi
      - run: node scripts/build-tsbot.mjs
      # Use "tsbot-nara" (tsbot-nara.pages.dev); "nara-tsbot" if that subdomain is taken by someone else (Cloudflare would
      # hand out a suffixed name instead, so that just-created project is removed again). The "tsbot" project is not
      # used: tsbot.pages.dev never started serving (522 / NXDOMAIN).
      - name: Pick the Pages projects
        id: project
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          subdomain() { curl -fsS -H "$AUTH" "$API/$1" 2>/dev/null | jq -r '.result.subdomain // empty'; }
          ensure() {
            local sub; sub=$(subdomain "$1")
            if [ -z "$sub" ]; then
              npx wrangler pages project create "$1" --production-branch=main > /dev/null
              sub=$(subdomain "$1")
              if [ "$sub" != "$1.pages.dev" ]; then
                echo "$1.pages.dev is taken (got $sub)"
                curl -fsS -X DELETE -H "$AUTH" "$API/$1" > /dev/null
                return 1
              fi
            elif [ "$sub" != "$1.pages.dev" ]; then
              return 1
            fi
            echo "name=$1" >> "$GITHUB_OUTPUT"
            echo "url=https://$sub" >> "$GITHUB_OUTPUT"
          }
          ensure tsbot-nara || ensure nara-tsbot || { echo "::error::tsbot-nara.pages.dev and nara-tsbot.pages.dev are both taken."; exit 1; }
          # IMTS must be exactly imtsbot.pages.dev: that is the origin TSbot allows to frame it.
          sub=$(subdomain imtsbot)
          if [ -z "$sub" ]; then
            npx wrangler pages project create imtsbot --production-branch=main > /dev/null
            sub=$(subdomain imtsbot)
            if [ "$sub" != "imtsbot.pages.dev" ]; then curl -fsS -X DELETE -H "$AUTH" "$API/imtsbot" > /dev/null; fi
          fi
          if [ "$sub" != "imtsbot.pages.dev" ]; then echo "::error::imtsbot.pages.dev is taken by another account."; exit 1; fi
      - run: npx wrangler pages deploy tsbot/dist --project-name="${{ steps.project.outputs.name }}" --branch=main --commit-dirty=true
      - run: node scripts/build-imts.mjs
        env:
          TSBOT_URL: ${{ steps.project.outputs.url }}
      - run: npx wrangler pages deploy imts/dist --project-name=imtsbot --branch=main --commit-dirty=true
      # A new pages.dev subdomain can take a few minutes; fail loudly if a site never answers instead of reporting success.
      - name: Check both sites answer
        env:
          TSBOT_URL: ${{ steps.project.outputs.url }}
        run: |
          for url in "$TSBOT_URL/" "https://imtsbot.pages.dev/"; do
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
              [ "$code" = "200" ] && { echo "$url → 200"; break; }
              [ "$i" = "30" ] && { echo "::error::$url still answers $code after 5 minutes."; exit 1; }
              sleep 10
            done
          done
      - name: Summary
        env:
          TSBOT_URL: ${{ steps.project.outputs.url }}
          TSBOT_ORIGINS: ${{ vars.TSBOT_ORIGINS }}
        run: |
          # deploy.yml pins the TSbot bot to TSBOT_ORIGINS (default https://tsbot-nara.pages.dev).
          if [ "$TSBOT_URL" != "https://tsbot-nara.pages.dev" ] && [[ ",$TSBOT_ORIGINS," != *",$TSBOT_URL,"* ]]; then
            echo "::warning::TSbot is at $TSBOT_URL. Set the TSBOT_ORIGINS repository variable to it and re-run Deploy to Cloudflare, or the bot refuses TSbot."
          fi
          echo "TSbot is live at ${{ steps.project.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "IMTS (showing TSbot) is live at https://imtsbot.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "Add ${{ steps.project.outputs.url }} to the bot's allowed origins in the Nara dashboard (if that list is not empty)." >> "$GITHUB_STEP_SUMMARY"
