# Deploys MeetNaraBot to Cloudflare on every push to main (and on demand).
#
# Required GitHub repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   API token with: Workers Scripts:Edit, D1:Edit, Vectorize:Edit,
#                          Workers AI:Read, Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID  Your Cloudflare account ID
# Optional secrets (only pushed to the Worker when present):
#   ADMIN_PASSWORD         Dashboard password (required once, before the first sign-in)
#   GEMINI_API_KEY         Gemini key (can also be pasted in the dashboard instead)
#   HF_TOKEN               Hugging Face token for the gpt-oss-120b fallback
#   TELEGRAM_BOT_TOKEN     Telegram bot token from @BotFather (webhook is connected automatically)
#   WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_VERIFY_TOKEN, WHATSAPP_APP_SECRET
#                          WhatsApp Cloud API (Meta) credentials
#
# After deploying, docs/knowledge/meetnarabot.md is indexed as the bot's reference document
# when no document is active yet, using a random DEPLOY_TOKEN minted for this run (it can only
# index documents and connect Telegram, and is replaced on every deploy). Run the workflow manually with
# "reseed" ticked to replace the active document with the current file.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reseed:
        description: Replace the active document with docs/knowledge/meetnarabot.md
        type: boolean
        default: false

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qa:
    uses: ./.github/workflows/qa.yml

  deploy:
    needs: qa
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first."
            exit 1
          fi

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Create or find the D1 database
        run: |
          set -euo pipefail
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="tanyasaya-db") | .uuid' | head -n1)
          if [ -z "$ID" ]; then
            npx wrangler d1 create tanyasaya-db
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="tanyasaya-db") | .uuid' | head -n1)
          fi
          if [ -z "$ID" ]; then echo "::error::Could not find or create the D1 database tanyasaya-db."; exit 1; fi
          sed -i "s/REPLACE_WITH_D1_ID/$ID/" wrangler.jsonc
          echo "D1 database: $ID"

      - name: Create the Vectorize index if missing
        run: |
          set -euo pipefail
          if npx wrangler vectorize list --json | jq -e '.[] | select(.name=="tanyasaya-index")' > /dev/null; then
            echo "Vectorize index exists."
          else
            npx wrangler vectorize create tanyasaya-index --dimensions=1024 --metric=cosine
          fi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply tanyasaya-db --remote

      - name: Deploy Worker
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Push optional Worker secrets
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "$ADMIN_PASSWORD" ]; then
            printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          else
            echo "::warning::ADMIN_PASSWORD repository secret is empty or missing, so the dashboard cannot be used yet. Add it under Settings > Secrets and variables > Actions > Repository secrets (not Environment secrets or Variables), then re-run this workflow."
          fi
          if [ -n "$GEMINI_API_KEY" ]; then printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY; fi
          for name in HF_TOKEN TELEGRAM_BOT_TOKEN WHATSAPP_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_VERIFY_TOKEN WHATSAPP_APP_SECRET; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s' "$value" | npx wrangler secret put "$name"; fi
          done

      - name: Mint a one-run deploy token
        id: token
        run: |
          set -euo pipefail
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" | npx wrangler secret put DEPLOY_TOKEN > /dev/null
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Index the reference document
        env:
          ADMIN_PASSWORD: ${{ steps.token.outputs.token }}
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          RESEED: ${{ inputs.reseed && '--replace' || '' }}
        run: |
          set -euo pipefail
          if [ -z "$WORKER_URL" ]; then echo "::warning::Skipped: could not read the Worker URL from the deploy output."; exit 0; fi
          sleep 8
          node scripts/seed-document.mjs "$WORKER_URL" docs/knowledge/meetnarabot.md $RESEED

      - name: Connect the Telegram webhook
        env:
          DEPLOY_TOKEN: ${{ steps.token.outputs.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "Telegram not configured; skipped."; exit 0; fi
          if [ -z "$WORKER_URL" ]; then echo "::warning::Skipped: the Worker URL is missing."; exit 0; fi
          curl -fsS -X POST "$WORKER_URL/api/admin/channels/telegram/connect" -H "Authorization: Bearer $DEPLOY_TOKEN" -H 'X-Lang: en' > /dev/null
          echo "Telegram webhook connected."
