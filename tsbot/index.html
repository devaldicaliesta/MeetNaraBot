<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>TSbot</title>
  <link rel="stylesheet" href="/page.css">
  <!-- Opens the connection to the Nara API while the page loads, so the first answer does not wait for it.
       crossorigin: the widget fetches without credentials (CORS anonymous), and a preconnect only helps a matching request. -->
  <link rel="preconnect" href="__NARA_API__" crossorigin>
  <script src="/widget.js" defer></script>
</head>
<body>
  <main>
    <tanyasaya-chat mode="inline" api-base="__NARA_API__" bot="__NARA_BOT__" css="/widget.css" lang="id" menu="tsbot-menu"></tanyasaya-chat>
    <!-- The category menu (tsbot/menu.json, checked by scripts/build-tsbot.mjs). A data block: it never runs as script. -->
    <script type="application/json" id="tsbot-menu">__MENU_JSON__</script>
  </main>
  <noscript>TSbot butuh JavaScript untuk menampilkan chat. Aktifkan JavaScript, lalu muat ulang halaman ini.</noscript>
</body>
</html>
